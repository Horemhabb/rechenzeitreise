<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a4f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechenzeitreise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Rechenzeitreise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Marcellus&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
/* Layout: eine Spalte auf Papyrus – oben ein Fries in den Farben ägyptischer Wandmalerei, Fortschritt mit Pfoten und Steinstufe,
   Tempelwahl, Aufgabenkarte mit Schritt-Hilfe, steinernes Ziffernfeld. Nachts: Nil unter Sternen. */
:root {
  --bg: #f1e3bf; --fiber: rgba(150, 110, 50, .09); --card: #fbf4e2; --card2: #f4e8cc; --ink: #2b2118; --muted: #6b5a42;
  --lapis: #2a4f9e; --lapis-soft: #dfe6f3; --turq: #1d8579; --turq-soft: #d4ede6; --carn: #b5442a; --carn-soft: #f6dccf;
  --gold: #b9860f; --gold-bright: #e0ad2c; --gold-soft: #f6e7b8; --mark: #fde9a1; --on: #ffffff; --veil: rgba(43, 33, 24, .62); --shadow: #2b2118;
  --font-display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --font-body: "Andika", "Trebuchet MS", system-ui, sans-serif;
  --font-hiero: "Noto Sans Egyptian Hieroglyphs", "Segoe UI Historic", "Apple Symbols", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a2c; --fiber: rgba(255, 255, 255, .025); --card: #1c2539; --card2: #222c43; --ink: #efe3c4; --muted: #b2a78d;
    --lapis: #8fb0ef; --lapis-soft: #263559; --turq: #5cc6b8; --turq-soft: #16393a; --carn: #f08d6c; --carn-soft: #452a21;
    --gold: #e8c158; --gold-bright: #e8c158; --gold-soft: #3c3119; --mark: #4a3e1a; --on: #111827; --veil: rgba(4, 7, 15, .74); --shadow: #05070d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a2c; --fiber: rgba(255, 255, 255, .025); --card: #1c2539; --card2: #222c43; --ink: #efe3c4; --muted: #b2a78d;
  --lapis: #8fb0ef; --lapis-soft: #263559; --turq: #5cc6b8; --turq-soft: #16393a; --carn: #f08d6c; --carn-soft: #452a21;
  --gold: #e8c158; --gold-bright: #e8c158; --gold-soft: #3c3119; --mark: #4a3e1a; --on: #111827; --veil: rgba(4, 7, 15, .74); --shadow: #05070d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  background-image: repeating-linear-gradient(0deg, var(--fiber) 0 2px, transparent 2px 7px), repeating-linear-gradient(90deg, var(--fiber) 0 3px, transparent 3px 13px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lapis); outline-offset: 3px; }

.app { max-width: 580px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 28px; display: flex; flex-direction: column; gap: 12px; }

/* Kopf mit Fries */
.frieze {
  height: 14px; border: 2px solid var(--ink); border-radius: 3px;
  background: repeating-linear-gradient(90deg, var(--lapis) 0 14px, var(--gold-bright) 14px 18px, var(--carn) 18px 32px, var(--gold-bright) 32px 36px, var(--turq) 36px 50px, var(--gold-bright) 50px 54px);
}
.top { display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.75rem; margin: 0; line-height: 1.05; letter-spacing: .02em; color: var(--lapis); text-wrap: balance; }
.cartouche {
  display: inline-flex; align-items: center; font-family: var(--font-hiero); font-size: 1.35rem; line-height: 1; padding: 3px 14px 3px 12px;
  border: 2.5px solid var(--ink); border-radius: 999px; background: var(--gold-soft); color: var(--ink); position: relative; letter-spacing: .04em; white-space: nowrap;
  font-size: 1.6rem; text-shadow: 0 0 .5px currentColor, 0 0 .5px currentColor, 0 0 .5px currentColor;
}
.cartouche::after { content: ""; position: absolute; right: -7px; top: 3px; bottom: 3px; width: 4px; background: var(--ink); border-radius: 2px; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: .88rem; white-space: nowrap; }
.chip:active { transform: translateY(1px); }

/* Fortschritt */
.status { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "paws stufe" "text stufe"; align-items: center; gap: 4px 10px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; }
.paws { grid-area: paws; } .status-text { grid-area: text; } .stufe { grid-area: stufe; }
.paws { display: flex; gap: 4px; }
.paw { width: 28px; height: 28px; }
.paws.many .paw { width: 18px; height: 18px; }
.paw * { fill: var(--card2); stroke: var(--muted); stroke-width: 1.6; transition: fill .2s; }
.paw.on * { fill: var(--gold-bright); stroke: var(--ink); }
.paw.pop { animation: pop .45s ease-out; }
.status-text { font-size: .82rem; color: var(--muted); line-height: 1.3; min-width: 0; }
.status-text b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gold-line { color: var(--gold); font-weight: 700; }
.stufe {
  border: 2px solid var(--ink); border-radius: 6px; padding: 3px 9px; font-family: var(--font-display); font-size: .95rem; line-height: 1.1; text-align: center;
  display: flex; flex-direction: column; box-shadow: 0 3px 0 var(--shadow); min-width: 78px;
}
.stufe small { font-family: var(--font-body); font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.s1 { background: #7a5a3a; color: #fff6e6; } .s2 { background: #d9c48b; color: #2b2118; } .s3 { background: #ece6d6; color: #2b2118; }
.s4 { background: linear-gradient(135deg, #a98a8a, #6e5b5e 60%, #8d7676); color: #fff; } .s5 { background: linear-gradient(135deg, #ffe9a0, #e0ad2c 55%, #a87a12); color: #2b2118; }

.temple-pick {
  display: flex; align-items: center; gap: 10px; text-align: left; background: var(--card2); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 12px;
}
.temple-pick small { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.temple-pick > span:nth-child(2) { flex: 1; min-width: 0; font-weight: 700; }
.tp-seal { width: 34px; height: 34px; flex: none; display: grid; place-items: center; }
.tp-seal svg { width: 34px; height: 34px; overflow: visible; }
.tp-change { font-size: .82rem; color: var(--lapis); text-decoration: underline; white-space: nowrap; }

/* Aufgabe */
.task { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--lapis); background: var(--lapis-soft); border-radius: 999px; padding: 2px 10px; }
.tag.knobel { color: var(--on); background: var(--carn); }
.tag.ueb { color: var(--turq); background: var(--turq-soft); }
.story { margin: 0; font-size: 1.12rem; line-height: 1.6; text-wrap: pretty; }
.story mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--gold-bright); }
.question { margin: 0; font-weight: 700; font-size: 1.1rem; text-wrap: pretty; }
.equation { font-family: var(--font-body); font-weight: 700; font-size: clamp(1.7rem, 8vw, 2.5rem); line-height: 1.25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .25em; font-variant-numeric: tabular-nums; text-align: center; }
.equation .unit { font-size: .6em; }
.pic { display: flex; justify-content: center; }
.fracpic { width: 150px; height: 150px; } .fracpic.wide { width: 260px; height: 66px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .1em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .12em; }
.fr .slot { margin: 2px 0; }
table.plan { border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; width: 100%; }
.table-wrap { overflow-x: auto; }
table.plan th, table.plan td { border: 2px solid var(--ink); padding: 4px 8px; text-align: left; white-space: nowrap; }
table.plan thead th { background: var(--gold-soft); }
table.plan tbody th { background: var(--card2); }
table.plan caption { text-align: left; color: var(--muted); font-size: .85rem; padding-bottom: 2px; }
.answer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1.15rem; }
.answer-row .label { font-weight: 700; }
.slot {
  min-width: 3.6em; padding: 1px 10px; text-align: center; font-family: var(--font-body); font-weight: 700; font-size: 1.5rem; line-height: 1.3; font-variant-numeric: tabular-nums;
  background: var(--card); border: 3px dashed var(--muted); border-radius: 10px; color: var(--lapis);
}
.equation .slot { font-size: 1em; }
.fr .slot { font-size: .7em; min-width: 2.2em; padding: 0 6px; }
.slot.small { font-size: 1.15rem; min-width: 3em; padding: 0 8px; border-width: 2px; }
.slot.empty { color: var(--muted); opacity: .55; }
.slot.active { border-color: var(--lapis); background: var(--lapis-soft); opacity: 1; }
.slot.right { border-style: solid; border-color: var(--turq); color: var(--turq); background: var(--turq-soft); opacity: 1; }
.slot.shown { border-style: solid; border-color: var(--muted); color: var(--muted); background: var(--card2); opacity: 1; }
.slot.wrong { animation: shake .4s; }
.unit { font-weight: 700; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.choice { border: 2px solid var(--ink); border-radius: 12px; background: var(--card); padding: 9px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--shadow); }
.choices.main .choice { font-size: 1.1rem; min-width: 7em; }
.choice:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.choice.right { background: var(--turq-soft); border-color: var(--turq); color: var(--turq); }
.choice.wrong { animation: shake .4s; background: var(--carn-soft); }
.choice[disabled] { cursor: default; }
.choices.small { justify-content: flex-start; }
.choices.small .choice { padding: 5px 11px; font-size: .95rem; box-shadow: 0 2px 0 var(--shadow); }
.feedback { margin: 0; font-weight: 700; font-size: 1.05rem; text-wrap: pretty; }
.feedback:empty { display: none; }
.feedback.good { color: var(--turq); } .feedback.try { color: var(--carn); }
.solution { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--turq-soft); border: 2px solid var(--turq); text-wrap: pretty; }
.solution b { color: var(--turq); }
.explain { display: block; margin-top: 4px; color: var(--muted); font-size: .95rem; }
.offer { border: 2px dashed var(--gold); border-radius: 12px; padding: 10px 12px; background: var(--gold-soft); }
.offer p { margin: 0 0 8px; }
.actions, .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 15px; font-weight: 700; box-shadow: 0 4px 0 var(--shadow); background: var(--card); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn.help { background: var(--gold-soft); }
.btn.help.nudge { animation: nudge 1.2s ease-in-out 2; }
.btn.go { background: var(--lapis); color: var(--on); }

/* Schritt-Hilfe */
.helper { display: flex; flex-direction: column; gap: 12px; border-top: 2px dashed var(--muted); padding-top: 12px; }
.phase h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 1.08rem; color: var(--lapis); }
.phase p { margin: 0; } .phase ul { margin: 2px 0 6px; padding-left: 1.2em; }
.wanted { font-weight: 700; } .distract { color: var(--carn); font-size: .95rem; margin-top: 4px !important; }
.steps { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: st; }
.step { border: 2px solid var(--card2); border-radius: 12px; padding: 8px 10px 10px 40px; position: relative; counter-increment: st; display: flex; flex-direction: column; gap: 6px; }
.step::before { content: counter(st); position: absolute; left: 9px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--card2); color: var(--ink); font-weight: 700; font-size: .85rem; display: flex; align-items: center; justify-content: center; }
.step.active { border-color: var(--lapis); }
.step.active::before { background: var(--lapis); color: var(--on); }
.step.done { border-color: var(--turq-soft); }
.step.done::before { background: var(--turq); color: var(--on); content: "✓"; }
.step.shown::before { background: var(--muted); color: var(--on); content: "!"; }
.step.info { border-style: dashed; }
.step.info::before { content: "i"; background: var(--gold-bright); color: #2b2118; }
.step p { margin: 0; }
.calc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.step-fb { font-size: .95rem; font-weight: 700; color: var(--carn); } .step-fb:empty { display: none; }
.step-tip { font-size: .95rem; color: var(--muted); } .paper-note { font-size: .88rem; color: var(--muted); }

/* Ziffernfeld wie Steintafeln */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.key { height: 54px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card2); font-family: var(--font-body); font-weight: 700; font-size: 1.65rem; box-shadow: 0 4px 0 var(--shadow); touch-action: manipulation; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.key.del { background: var(--carn-soft); font-size: 1rem; }
.key.sep { font-size: 1.5rem; }
.key.ok { grid-column: 1 / -1; background: var(--turq); color: var(--on); font-size: 1.3rem; }
.app.helping .pad { position: sticky; bottom: 0; z-index: 2; gap: 6px; padding: 8px 0 10px; background: var(--bg); border-top: 2px solid var(--muted); grid-template-columns: repeat(4, 1fr); }
.app.helping .key { height: 44px; font-size: 1.35rem; box-shadow: 0 3px 0 var(--shadow); }
.app.helping .key.del { font-size: .88rem; } .app.helping .key.ok { font-size: 1.1rem; }
.foot { margin: 0; font-size: .78rem; color: var(--muted); text-align: center; } .foot:empty { display: none; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--veil); overflow-y: auto; }
.sheet { width: 100%; max-width: 440px; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; box-shadow: 0 8px 0 var(--shadow); margin: auto; }
.sheet.wide { max-width: 560px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--lapis); text-wrap: balance; }
.sheet p { margin: 0; }
.reward-sheet { animation: pop .5s ease-out; }
.reward-sheet.is-gold { border-color: var(--gold); box-shadow: 0 8px 0 var(--gold), 0 0 0 6px var(--gold-soft); }
.badge-new { font-weight: 700; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--on); background: var(--carn); border-radius: 999px; padding: 2px 12px; }
.photo { width: 100%; max-width: 360px; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; border: 3px solid var(--ink); background: var(--card2); }
.photo img, .photo svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo.gold { border: 5px solid var(--gold-bright); box-shadow: 0 0 0 3px var(--ink), 0 0 22px var(--gold-bright); }
.photo.treasure { aspect-ratio: 1; max-width: 260px; }
.photo.stone { aspect-ratio: auto; border: 0; background: none; display: grid; place-items: center; }
.stone-tile { width: 180px; height: 110px; border: 3px solid var(--ink); border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.6rem; box-shadow: 0 6px 0 var(--shadow); margin: 0 auto; }
.pup-name { font-family: var(--font-display); font-size: 1.35rem; }
.pup-fact { text-align: left; text-wrap: pretty; }
.credit { font-size: .72rem; color: var(--muted); }
.note { color: var(--muted); font-size: .88rem; margin: 0; }
.big-btn { border: 2px solid var(--ink); border-radius: 14px; background: var(--lapis); color: var(--on); font-weight: 700; font-size: 1.1rem; padding: 11px 22px; box-shadow: 0 4px 0 var(--shadow); }
.big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.link-btn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); }
.link-btn.danger { color: var(--carn); font-weight: 700; }

/* Urkunde auf Papyrus (immer hell, wie echter Papyrus) */
.papyrus {
  width: 100%; max-width: 440px; margin: auto; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: #2b2118;
  background-color: #ecd9a6; background-image: repeating-linear-gradient(0deg, rgba(120, 85, 30, .12) 0 2px, transparent 2px 6px), repeating-linear-gradient(90deg, rgba(120, 85, 30, .1) 0 3px, transparent 3px 11px);
  border-radius: 6px; border: 2px solid #6b4f22; box-shadow: 0 10px 30px rgba(0, 0, 0, .4), inset 0 0 40px rgba(120, 80, 20, .3); animation: pop .5s ease-out;
}
.papyrus .cartouche { background: #f6e7b8; border-color: #2b2118; color: #2b2118; }
.papyrus .cartouche::after { background: #2b2118; }
.doc-head { margin: 0; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: #8a3a22; font-weight: 700; }
.papyrus h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; color: #1f3d7a; }
.doc-art { display: flex; align-items: flex-end; justify-content: center; gap: 12px; }
.doc-god svg { height: 150px; width: auto; } .doc-seal svg { width: 72px; height: 72px; overflow: visible; } .doc-ruler svg { width: 150px; height: auto; }
.doc-text { margin: 0; font-size: 1.05rem; text-wrap: pretty; }
.doc-foot { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: .9rem; color: #5a4520; }
.papyrus .big-btn { background: #1f3d7a; color: #fff; border-color: #2b2118; box-shadow: 0 4px 0 #2b2118; }

/* Sammlung */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.tab { border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; background: var(--card2); font-weight: 700; font-size: .9rem; }
.tab.on { background: var(--lapis); color: var(--on); }
#collBody { width: 100%; }
.grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.item { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; font-weight: 700; min-width: 0; background: none; border: 0; padding: 0; text-align: center; }
.item .photo { max-width: none; aspect-ratio: 1; border-width: 2px; }
.item .photo.gold { border-width: 4px; }
.item.locked { color: var(--muted); font-weight: 400; }
.lock { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--muted); display: grid; place-items: center; font-family: var(--font-display); font-size: 2.4rem; color: var(--muted); background: var(--card2); }
.career { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; }
.career-art svg { width: 96px; height: auto; }
.rank { font-family: var(--font-display); font-size: 1.5rem; margin: 0; color: var(--gold); }
.ladder { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; text-align: left; }
.ladder li { padding: 4px 10px; border-radius: 8px; border: 2px solid var(--card2); color: var(--muted); }
.ladder li.on { border-color: var(--gold); color: var(--ink); background: var(--gold-soft); font-weight: 700; }
.ladder small { font-weight: 400; color: var(--muted); }
.temple-list, .temple-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; width: 100%; }
.temple-card { display: flex; align-items: center; gap: 8px; text-align: left; border: 2px solid var(--ink); border-radius: 12px; background: var(--card2); padding: 4px 8px; min-width: 0; }
.temple-card.on { border-color: var(--lapis); box-shadow: 0 0 0 3px var(--lapis-soft); }
.tc-god { width: 42px; height: 80px; flex: none; display: grid; place-items: center; }
.tc-god svg { width: 42px; height: 80px; }
.tc-god.auto svg { width: 30px; height: 40px; overflow: visible; }
.tc-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tc-text small { color: var(--muted); font-size: .8rem; line-height: 1.25; }
.tc-seal svg { width: 40px; height: 40px; overflow: visible; }
.doc-list { list-style: none; padding: 0; margin: 0; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.doc-list .link-btn { color: var(--lapis); font-weight: 700; }
.detail-art { width: 100%; display: flex; justify-content: center; }
.detail-art .photo { max-width: 320px; }
.detail-god svg { height: 190px; width: auto; }
.detail-text { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.detail-text p { margin: 0; } .myth { font-style: italic; }
.detail-text .stone-tile { margin: 0 auto; }

/* Eltern */
.parents-sheet { text-align: left; align-items: stretch; }
.parents-sheet h2 { text-align: center; }
.psec { border-top: 2px solid var(--card2); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.psec h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--lapis); }
.psec p { margin: 0; }
.row-check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.row-check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--lapis); flex: none; }
.row-check small { display: block; color: var(--muted); font-size: .82rem; }
.area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.row-range { display: flex; flex-direction: column; gap: 2px; }
.row-range input { width: 100%; accent-color: var(--lapis); }
.row-sel, .row-text { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.row-sel select, .row-text input, #parentsBody textarea { background: var(--card2); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
#parentsBody textarea { width: 100%; font-size: .8rem; font-family: ui-monospace, Menlo, monospace; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.segb { border: 2px solid var(--ink); border-radius: 8px; padding: 3px 8px; background: var(--card2); font-size: .85rem; }
.segb.on { background: var(--lapis); color: var(--on); }
.lern { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 4px; }
.lern li { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; border-bottom: 1px dashed var(--card2); padding-bottom: 3px; }
.lern small { color: var(--muted); }
.pill { white-space: nowrap; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--card2); }
.pill.sicher { background: var(--turq-soft); color: var(--turq); } .pill.uebend { background: var(--gold-soft); color: var(--gold); } .pill.wackelig { background: var(--carn-soft); color: var(--carn); }
details summary { cursor: pointer; font-weight: 700; } details summary small { color: var(--muted); font-weight: 400; }
.reset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@media (max-width: 380px) { h1 { font-size: 1.5rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>

    <div class="frieze" aria-hidden="true"></div>

  <button class="temple-pick" id="templeBtn" type="button"></button>

  <main class="task" id="task"></main>
  <div class="choices main" id="mainChoices" hidden></div>

<div class="overlay" id="reward" hidden role="dialog" aria-modal="true" aria-labelledby="rewardTitle">

</div>

<div class="overlay" id="doc" hidden role="dialog" aria-modal="true" aria-labelledby="docTitle">

      <button class="tab" role="tab" data-tab="gold" type="button">Gold</button>
      <button class="tab" role="tab" data-tab="temples" type="button">Tempel</button>
      <button class="tab" role="tab" data-tab="docs" type="button">Urkunden</button>

</div>

    <div id="parentsBody"></div>
    <button class="big-btn" id="parentsClose" type="button">Fertig</button>

<script>
(() => {
  // ===================== Hilfsfunktionen =====================
  const R = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => arr.map((v) => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const round2 = (x) => Math.round(x * 100) / 100;
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const M = (s) => `⟦${s}⟧`; // im Text markierte Angabe

  // Zahlen deutsch: 16 000, 2,5 und 2,05
  function fz(x) {
    x = round2(x);
    if (Number.isInteger(x)) return Math.abs(x) >= 10000 ? String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " ") : String(x);
    return String(x).replace(".", ",");
  }
  const eur = (x) => (Number.isInteger(round2(x)) ? fz(x) : round2(x).toFixed(2).replace(".", ",")) + " €";
  const mz = (cm) => (cm / 100).toFixed(2).replace(".", ","); // 240 cm -> "2,40"
  const tm = (min) => `${Math.floor(min / 60)}.${String(min % 60).padStart(2, "0")}`;
  const dauer = (min) => {
    const h = Math.floor(min / 60), m = min % 60;
    const hs = h ? `${h} Stunde${h > 1 ? "n" : ""}` : "", ms = m ? `${m} Minuten` : "";
    return [hs, ms].filter(Boolean).join(" und ");
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const NAMES = [["Lena", "f"], ["Jonas", "m"], ["Mia", "f"], ["Paul", "m"], ["Frida", "f"], ["Ben", "m"], ["Ida", "f"],
    ["Noah", "m"], ["Greta", "f"], ["Karl", "m"], ["Marie", "f"], ["Finn", "m"], ["Lotta", "f"], ["Emil", "m"], ["Ronja", "f"], ["Anton", "m"],
    ["Nefer", "f"], ["Amun", "m"], ["Merit", "f"], ["Kamose", "m"]];
  function person() {
    const [n, g] = pick(NAMES), f = g === "f";
    return { n, er: f ? "sie" : "er", Er: f ? "Sie" : "Er", sein: f ? "ihr" : "sein", Sein: f ? "Ihr" : "Sein", ihm: f ? "ihr" : "ihm" };
  }

  // Schritt-Bausteine: calc mit ? zeigt, wo das Eingabefeld steht
  const S = (text, calc, value, unit, tip, type = "num") => ({ text, calc, value, unit, tip, type });
  const SM = (text, calc, value, tip) => ({ text, calc, value, unit: "€", tip, type: "money" });
  const ST = (text, calc, value, tip) => ({ text, calc, value, unit: "Uhr", tip, type: "time" });
  const SC = (text, options, value, tip) => ({ text, options, value, tip, type: "choice" });
  const SI = (text) => ({ text, type: "info" });
  const SF = (text, calc, n, d, tip) => ({ text, calc, value: n / d, frac: [n, d], tip, type: "frac" });
  const SR = (text, calc, q, r, tip) => ({ text, calc, value: q, rest: r, tip, type: "rest" });

  // Bruch als HTML (gestapelt)
  const frH = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;

  // ===================== Das alte Ägypten: Tempel, Laufbahn, Herrscher, Goldschätze =====================
  // Jeder Aufgabenbereich gehört zu einem Tempel. Grade je Tempel (Novizin, Priesterin, Hohepriesterin)
  // ergeben zusammen die Laufbahn von der Schreiberschülerin bis zur Pharaonin.
  const TEMPLES = [
    { id: "text", god: "ra", area: "Textaufgaben", short: "Geschichten",
      why: "Ra fährt jeden Tag mit seiner Sonnenbarke über den Himmel. So reisen auch die Rechen-Geschichten durch Märkte, Gärten und Zeiten." },
    { id: "mal", god: "thot", area: "Großes Einmaleins", short: "Einmaleins",
      why: "Thot ist der Gott des Rechnens. Die Schreiber riefen ihn an, bevor sie zu rechnen begannen." },
    { id: "pm", god: "osiris", area: "Plus und Minus bis 1000", short: "Plus · Minus",
      why: "Osiris lässt das Korn wachsen. Wer die Ernte zählt, rechnet in großen Zahlen." },
    { id: "teil", god: "bastet", area: "Teilen", short: "Teilen",
      why: "Bastet beschützt Haus und Familie. Wo eine Familie wohnt, wird gerecht geteilt." },
    { id: "bruch", god: "isis", area: "Brüche und Kommazahlen", short: "Brüche",
      why: "Isis fand alle verlorenen Teile wieder und fügte sie zu einem Ganzen. Genau darum geht es bei Brüchen." },
    { id: "schrift", god: "seschat", area: "Schriftliches Rechnen", short: "Schriftlich",
      why: "Seschat ist die Göttin der Schrift und des Messens. Sie schreibt alles ordentlich untereinander." },
    { id: "schaetz", god: "horus", area: "Schätzen und Überschlagen", short: "Schätzen",
      why: "Horus ist ein Falke. Von hoch oben sieht er mit einem Blick, wie groß etwas ungefähr ist." },
    { id: "trick", god: "hathor", area: "Rechentricks", short: "Tricks",
      why: "Hathor ist die Göttin der Freude. Mit einem guten Trick wird schweres Rechnen leicht und fröhlich." },
  ];
  const TEMPLE_BY_ID = Object.fromEntries(TEMPLES.map((t) => [t.id, t]));

  const GODS = {
    ra: { name: "Ra", title: "Gott der Sonne",
      fact: "Ra ist der Sonnengott. Er wird mit dem Kopf eines Falken und einer Sonnenscheibe darauf gezeigt.",
      story: "Am Tag fährt Ra mit seiner Barke über den Himmel. In der Nacht reist er durch die Unterwelt, wo die große Schlange Apophis auf ihn wartet. Jeden Morgen besiegt er sie, und darum geht die Sonne immer wieder auf." },
    thot: { name: "Thot", title: "Gott der Weisheit, der Schrift und des Rechnens",
      fact: "Thot hat den Kopf eines Ibis, eines Vogels mit langem, gebogenem Schnabel. Die Ägypter glaubten, er habe die Hieroglyphen erfunden.",
      story: "Einmal spielte Thot gegen den Mond ein Brettspiel und gewann ein kleines Stück seines Lichts, etwa ein Siebzigstel. Daraus machte er fünf neue Tage. Seitdem hat das Jahr 365 Tage statt 360. Rechne nach: 360 : 70 ist ungefähr 5." },
    osiris: { name: "Osiris", title: "Gott der Unterwelt und der Fruchtbarkeit",
      fact: "Osiris hat grüne Haut wie junges Korn. Er trägt eine hohe weiße Krone mit Federn, einen Krummstab und eine Geißel.",
      story: "Sein Bruder Seth war eifersüchtig und ließ Osiris verschwinden. Seine Frau Isis suchte ihn überall und fand ihn wieder. Seitdem herrscht Osiris im Jenseits und lässt jedes Jahr nach der Nilflut das Korn neu wachsen." },
    bastet: { name: "Bastet", title: "Göttin der Katzen, Beschützerin von Haus und Familie",
      fact: "Bastet hat den Kopf einer Katze. In ihrer Stadt Bubastis feierten die Menschen große Feste mit Musik und Tanz.",
      story: "Früher stellte man Bastet als wilde Löwin dar. Mit der Zeit wurde sie zur sanften Hauskatze, die das Haus vor Mäusen und Schlangen schützt und über die Kinder wacht." },
    isis: { name: "Isis", title: "Göttin der Zauberkraft, Mutter des Horus",
      fact: "Isis trägt einen Thron auf dem Kopf. Ihr Name bedeutet wahrscheinlich „Thron“ oder „Sitz“.",
      story: "Als Osiris verschwunden war, suchte Isis das ganze Land ab. Mit Geduld und Zauberkraft fand sie alle verlorenen Teile und fügte sie wieder zu einem Ganzen zusammen." },
    seschat: { name: "Seschat", title: "Göttin der Schrift und des Messens",
      fact: "Seschat trägt einen Stern mit sieben Zacken über dem Kopf und ein Pantherfell über dem Kleid.",
      story: "Bevor ein Tempel gebaut wurde, spannte der Pharao mit Seschat eine Schnur über den Boden und maß den Grundriss ab. Diese Feier hieß „Strickspannen“." },
    horus: { name: "Horus", title: "Gott des Himmels, ein Falke",
      fact: "Horus ist der Sohn von Isis und Osiris. Sein Auge, das Udjat-Auge, war ein beliebtes Schutzamulett.",
      story: "Im Streit mit Seth verlor Horus ein Auge. Thot, der weise Gott, heilte es wieder. Seitdem steht das Horusauge für Schutz und Heilung." },
    hathor: { name: "Hathor", title: "Göttin der Liebe, der Musik und der Freude",
      fact: "Hathor trägt Kuhhörner mit einer Sonnenscheibe dazwischen. Ihr Musikinstrument ist das Sistrum, eine Rassel.",
      story: "Die Ägypter glaubten, der Klang ihres Sistrums vertreibe schlechte Laune und alles Böse. Bei ihren Festen wurde gesungen, getanzt und gelacht." },
  };

  // Laufbahn: Punkte = Summe aller Tempelgrade (je Tempel 0 bis 3)
  const RANKS = [
    { min: 0, f: "Schreiberschülerin", m: "Schreiberschüler", ruler: null },
    { min: 2, f: "Schreiberin", m: "Schreiber", ruler: "cheops" },
    { min: 6, f: "Oberschreiberin", m: "Oberschreiber", ruler: "nofretete" },
    { min: 12, f: "Wesirin", m: "Wesir", ruler: "ramses" },
    { min: 18, f: "Pharaonin", m: "Pharao", ruler: "hatschepsut" },
  ];
  const GRADES = { f: ["", "Novizin", "Priesterin", "Hohepriesterin"], m: ["", "Novize", "Priester", "Hohepriester"] };
  const SEALS = ["", "Bronze", "Silber", "Gold"];

  const RULERS = {
    cheops: { name: "Cheops", years: "um 2600 v. Chr.",
      fact: "Cheops ließ die Große Pyramide von Gizeh bauen. Sie war ursprünglich etwa 146 m hoch.",
      story: "Die Pyramide besteht aus über zwei Millionen Steinblöcken. Fast 4000 Jahre lang war sie das höchste Bauwerk der Welt." },
    nofretete: { name: "Nofretete", years: "um 1350 v. Chr.",
      fact: "Nofretete war die Königin an der Seite von Pharao Echnaton. Ihr Name bedeutet „Die Schöne ist gekommen“.",
      story: "1912 fanden Forscher in der Stadt Amarna ihre bemalte Büste mit der blauen Krone. Heute steht sie im Neuen Museum in Berlin." },
    ramses: { name: "Ramses II.", years: "um 1279 bis 1213 v. Chr.",
      fact: "Ramses II. regierte etwa 66 Jahre lang, so lange wie kaum ein anderer Pharao.",
      story: "Er ließ die Tempel von Abu Simbel in einen Felsen hauen. Als ein Stausee sie überfluten sollte, wurden sie in den 1960er-Jahren in Blöcke zersägt und weiter oben wieder aufgebaut." },
    hatschepsut: { name: "Hatschepsut", years: "um 1479 bis 1458 v. Chr.",
      fact: "Hatschepsut regierte als Pharaonin. Bei Feiern trug sie den Königsbart wie ein männlicher Pharao.",
      story: "Sie schickte Schiffe ins ferne Land Punt. Die brachten Weihrauchbäume mit, die vor ihrem Tempel in Deir el-Bahari gepflanzt wurden." },
    tutanchamun: { name: "Tutanchamun", years: "um 1332 bis 1323 v. Chr.",
      fact: "Tutanchamun wurde schon mit etwa neun Jahren König.",
      story: "1922 entdeckte Howard Carter sein Grab mit über 5000 Schätzen. Die berühmte Goldmaske wiegt etwa 10 kg." },
    kleopatra: { name: "Kleopatra VII.", years: "69 bis 30 v. Chr.",
      fact: "Kleopatra war die letzte Herrscherin des alten Ägypten.",
      story: "Sie sprach viele Sprachen. Ein Geschichtsschreiber berichtet, sie sei die Erste ihrer Familie gewesen, die auch Ägyptisch lernte." },
  };

  // Goldschätze: jedes zweite Goldbild (abwechselnd mit einem Gold-Welpen)
  const TREASURES = [
    { id: "kartusche", name: "Deine goldene Kartusche", ruler: null,
      fact: "Eine Kartusche ist ein Ring aus Seil, der einen Namen beschützt. In Kartuschen schrieben die Ägypter die Namen ihrer Pharaonen." },
    { id: "maske", name: "Die Goldmaske des Tutanchamun", ruler: "tutanchamun",
      fact: "Die Maske ist aus Gold mit blauem Glas und Halbedelsteinen. Sie lag auf dem Gesicht der Mumie des jungen Königs." },
    { id: "skarabaeus", name: "Der goldene Skarabäus", ruler: null,
      fact: "Der Skarabäus ist ein Käfer, der eine Kugel vor sich herrollt. Die Ägypter sahen darin den Sonnengott, der die Sonne über den Himmel rollt." },
    { id: "muenze", name: "Kleopatras Münze", ruler: "kleopatra",
      fact: "Kleopatra ließ Münzen mit ihrem eigenen Bild prägen. Einige davon gibt es bis heute." },
    { id: "auge", name: "Das Horusauge", ruler: null,
      fact: "Das Udjat-Auge des Horus war ein Schutzamulett. Viele Ägypter trugen es an einer Kette." },
    { id: "nofretete", name: "Die Büste der Nofretete", ruler: "nofretete",
      fact: "Die Büste ist aus Kalkstein und bunt bemalt. Ein Auge wurde nie eingesetzt, warum, weiß niemand genau." },
    { id: "anch", name: "Das Anch", ruler: null,
      fact: "Das Anch ist die Hieroglyphe für „Leben“. Götter halten es oft in der Hand." },
    { id: "pyramide", name: "Die Pyramide des Cheops", ruler: "cheops",
      fact: "Früher war die Pyramide mit glattem weißem Kalkstein verkleidet und glänzte in der Sonne." },
    { id: "barke", name: "Die Sonnenbarke des Ra", ruler: null,
      fact: "Neben der Cheops-Pyramide fanden Forscher ein über 40 m langes Boot aus Zedernholz, vielleicht für die Reise des Königs mit dem Sonnengott." },
    { id: "abusimbel", name: "Der Tempel von Abu Simbel", ruler: "ramses",
      fact: "Vor dem Tempel sitzen vier riesige Figuren von Ramses II., jede etwa 20 m hoch." },
    { id: "palette", name: "Die Schreibpalette des Thot", ruler: null,
      fact: "Schreiber hatten eine Palette mit schwarzer und roter Farbe und Binsen als Pinsel. Rot schrieb man zum Beispiel Überschriften." },
    { id: "tempel", name: "Der Tempel der Hatschepsut", ruler: "hatschepsut",
      fact: "Ihr Tempel in Deir el-Bahari hat drei große Terrassen und lehnt sich an eine steile Felswand." },
  ];
  const TREASURE_BY_ID = Object.fromEntries(TREASURES.map((t) => [t.id, t]));

  // Stufen (für alles eine): Sie sieht den Namen, Eltern sehen auch die Zahl
  const STUFEN = ["", "Nilschlamm", "Papyrus", "Kalkstein", "Granit", "Gold"];

  // Hieroglyphen-Alphabet (Einkonsonantenzeichen). Eine Annäherung: Die Ägypter schrieben keine Vokale wie wir.
  const HIERO = {
    A: "\u{1313F}", B: "\u{130C0}", C: "\u{133A1}", D: "\u{130A7}", E: "\u{131CB}", F: "\u{13191}", G: "\u{133BC}", H: "\u{13254}",
    I: "\u{131CB}", J: "\u{13193}", K: "\u{133A1}", L: "\u{130ED}", M: "\u{13153}", N: "\u{13216}", O: "\u{1336F}", P: "\u{132AA}",
    Q: "\u{1320E}", R: "\u{1308B}", S: "\u{132F4}", T: "\u{133CF}", U: "\u{13171}", V: "\u{13191}", W: "\u{13171}", X: "\u{133A1}\u{132F4}",
    Y: "\u{131CC}", Z: "\u{13283}", "Ä": "\u{1313F}", "Ö": "\u{1336F}", "Ü": "\u{13171}", "ß": "\u{132F4}",
  };
  function hieroName(name) {
    let s = String(name || "").toUpperCase().replace(/[^A-ZÄÖÜß]/g, ""), out = "";
    while (s) {
      if (s.startsWith("SCH")) { out += "\u{13219}"; s = s.slice(3); continue; }
      if (s.startsWith("TSCH")) { out += "\u{1337F}"; s = s.slice(4); continue; }
      if (s.startsWith("CH")) { out += "\u{1340D}"; s = s.slice(2); continue; }
      if (s.startsWith("PH")) { out += "\u{13191}"; s = s.slice(2); continue; }
      if (s.startsWith("EI") || s.startsWith("IE")) { out += "\u{131CB}"; s = s.slice(2); continue; }
      if (s.length > 1 && s[0] === s[1]) { s = s.slice(1); continue; }   // Doppelbuchstaben nur einmal
      out += HIERO[s[0]] || ""; s = s.slice(1);
    }
    return out;
  }

  add("ct2eur", "geld", 1, () => {
    const p = person();
    const c = pick([R(101, 999), 100 * R(1, 9) + R(1, 9), 1000 + R(1, 99), R(101, 999)]);
    const e = Math.floor(c / 100), r = c % 100;
    return {
      story: `${p.n} schüttet ${p.sein}e Spardose aus und zählt ${M(fz(c) + " Cent")}.`,
      question: "Wie viel Euro sind das? Schreib mit Komma.",
      answer: { type: "money", value: c / 100, unit: "€" },
      given: [`${fz(c)} ct in der Spardose`, "100 ct = 1 €"], wanted: "der Betrag in Euro, mit Komma geschrieben",
      bild: "Stell dir die vielen Münzen auf dem Tisch vor. Immer 100 Cent kannst du zu einem Euro-Häufchen zusammenschieben.",
      steps: [
        S("Wie viele volle Euro-Häufchen zu je 100 ct kannst du bilden?", `${fz(c)} ct = ? € und ein Rest`, e, "", `Wie oft passt 100 in ${fz(c)}?`),
        S("Wie viele Cent bleiben als Rest übrig?", `${fz(c)} ct − ${fz(e * 100)} ct = ? ct`, r, ""),
        SM("Jetzt mit Komma. Nach dem Komma stehen immer zwei Stellen für die Cent.", `${e} € ${r} ct = ? €`, c / 100,
          r < 10 ? `Vorsicht: ${r} ct schreibt man nach dem Komma als 0${r}.` : "Erst die Euro, dann ein Komma, dann die Cent."),
      ],
      sentence: `${fz(c)} Cent sind ${eur(c / 100)}.`,
    };
  });

  add("wechselgeld", "geld", 1, () => {
    const p = person();
    const item = pick([["ein Glas Honig", 400, 790], ["ein Bauernbrot", 310, 490], ["ein Bund Möhren", 115, 290], ["einen Blumenstrauß", 520, 1190], ["ein Stück Bergkäse", 340, 690], ["eine Tüte Äpfel", 215, 480]]);
    let price; do { price = 5 * R(item[1] / 5, item[2] / 5); } while (price % 100 === 0);
    const note = [500, 1000, 2000, 5000].find((n) => n > price);
    const full = Math.ceil(price / 100) * 100, up = full - price, back = note - price;
    const steps = [SM("Zähl vom Preis bis zum nächsten vollen Euro hoch.", `${eur(price / 100)} + ? € = ${eur(full / 100)}`, up / 100, `Wie viele Cent fehlen bis ${full / 100},00 €?`)];
    if (note > full) steps.push(SM(`Wie viel fehlt dann noch bis ${note / 100} €?`, `${eur(full / 100)} + ? € = ${eur(note / 100)}`, (note - full) / 100));
    if (note > full) steps.push(SM("Zähl beide Teile zusammen.", `${eur(up / 100)} + ${eur((note - full) / 100)} = ? €`, back / 100));
    return {
      story: `${p.n} kauft auf dem Wochenmarkt ${item[0]} für ${M(eur(price / 100))}. ${p.Er} bezahlt mit einem ${M(note / 100 + "-€-Schein")}.`,

  const PLACE = ["Einer", "Zehner", "Hunderter", "Tausender", "Zehntausender"];
  function colSteps(a, b, plus) {
    const steps = []; let carry = 0;
    const len = String(Math.max(a, b)).length;
    for (let i = 0; i < len; i++) {
      const da = Math.floor(a / 10 ** i) % 10, db = Math.floor(b / 10 ** i) % 10;
      if (plus) {
        const s = da + db + carry;
        steps.push(S(`${PLACE[i]}: ${da} + ${db}${carry ? " + " + carry + " (gemerkt)" : ""}`, `= ?`, s, "", s >= 10 ? `Schreib ${s % 10} und merke ${Math.floor(s / 10)}.` : null));
        carry = Math.floor(s / 10);
      } else {
        const top = da - carry, need = top < db;
        const s = (need ? top + 10 : top) - db;
        const tip = need
          ? (top < 0 ? "Hier steht 0, und du hast dir vorher schon 1 geliehen. Leih dir wieder 1 von der nächsten Stelle: Aus der 0 wird 10, minus die geliehene 1 macht 9."
            : `${top} reicht nicht für ${db}. Leih dir 1 von der nächsten Stelle: Aus ${top} wird ${top + 10}.`)
          : carry ? `Denk an die 1, die du dir geliehen hast: ${da} − 1 = ${top}.` : null;
        steps.push(S(`${PLACE[i]}: ${need ? (top + 10) : top} − ${db}`, "= ?", s, "", tip));
        carry = need ? 1 : 0;
      }
    }
    return steps;
  }

  const SEAL_COL = [["#d9d2c3", "#b9b1a0"], ["#e7b07a", "#9c5f2a"], ["#f1f3f6", "#9aa1ad"], ["#ffe9a0", "#b38412"]];
  function sealSVG(area, g) {
    const u = "s" + ++artUid, [c1, c2] = SEAL_COL[g || 0], god = TEMPLE_BY_ID[area].god, dim = !g;
    const sym = {
      ra: `<circle cx="0" cy="0" r="9" fill="${C.red}" stroke="${C.ink}" stroke-width="1.4"/>`,
      thot: `<path d="M-10 -2A10 10 0 0 0 10 -2" fill="none" stroke="${C.ink}" stroke-width="3"/><circle cx="0" cy="-4" r="6" fill="${C.white}" stroke="${C.ink}" stroke-width="1.4"/>`,
      osiris: `<path d="M-4 10L4 -10Q10 -14 8 -6" stroke="${C.ink}" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M-4 10L4 -10Q10 -14 8 -6" stroke="${C.lapis}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
      bastet: `<path d="M-8 6Q-8 -6 0 -6Q8 -6 8 6Z M-7 -3L-6 -12L-1 -6Z M1 -6L6 -12L7 -3Z" fill="${C.ink}"/>`,
      isis: `<path d="M-6 10V-10H0V0H8V10Z" fill="${C.lapis}" stroke="${C.ink}" stroke-width="1.4"/>`,
      seschat: star7(0, 0, 10),
      horus: `<path d="M-11 0Q0 -9 11 0Q0 7 -11 0Z" fill="${C.white}" stroke="${C.ink}" stroke-width="1.4"/><circle cx="-1" cy="0" r="3.4" fill="${C.ink}"/><path d="M-3 4L-5 11" stroke="${C.ink}" stroke-width="1.8"/>`,
      hathor: `<path d="M-10 6Q-13 -8 -5 -12M10 6Q13 -8 5 -12" stroke="${C.ink}" stroke-width="2.4" fill="none"/><circle cx="0" cy="-2" r="6" fill="${C.red}" stroke="${C.ink}" stroke-width="1.2"/>`,
    }[god];
    return `<svg viewBox="-30 -30 60 60" role="img" aria-label="${dim ? "noch kein Siegel" : "Siegel aus " + SEALS[g]}"><defs><radialGradient id="${u}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
      ${g ? `<path d="M-12 18L-18 30L-10 27L-6 33L-2 20Z M12 18L18 30L10 27L6 33L2 20Z" fill="${C.red}" stroke="${C.ink}" stroke-width="1"/>` : ""}
      <circle r="24" fill="url(#${u})" stroke="${C.ink}" stroke-width="1.6" ${dim ? 'stroke-dasharray="3 3" opacity=".7"' : ""}/>
      <circle r="19" fill="none" stroke="${c2}" stroke-width="1.6"/><g opacity="${dim ? 0.35 : 1}">${sym}</g></svg>`;
  }

  // Bruchbild: Kreis oder Streifen in d gleiche Teile, n gefärbt
  function fracSVG(shape, n, d) {
    if (shape === "kreis") {
      let s = "";
      for (let i = 0; i < d; i++) {
        const a0 = -Math.PI / 2 + (2 * Math.PI * i) / d, a1 = a0 + (2 * Math.PI) / d;
        const p = (a) => `${(60 + 46 * Math.cos(a)).toFixed(2)} ${(60 + 46 * Math.sin(a)).toFixed(2)}`;
        s += `<path d="M60 60L${p(a0)}A46 46 0 0 1 ${p(a1)}Z" fill="${i < n ? "var(--lapis)" : "var(--card)"}" stroke="var(--ink)" stroke-width="2.2"/>`;
      }
      return `<svg class="fracpic" viewBox="0 0 120 120" role="img" aria-label="Kreis in ${d} Teilen, ${n} davon gefärbt">${s}</svg>`;
    }
    const w = 220 / d;
    return `<svg class="fracpic wide" viewBox="0 0 240 60" role="img" aria-label="Streifen in ${d} Teilen, ${n} davon gefärbt">${Array.from({ length: d }, (_, i) =>
      `<rect x="${10 + i * w}" y="10" width="${w}" height="40" fill="${i < n ? "var(--lapis)" : "var(--card)"}" stroke="var(--ink)" stroke-width="2.2"/>`).join("")}</svg>`;
  }

  // ===================== LOGIK: Einstellungen, Lernstand, Auswahl, Stufe, Belohnungen (ohne Oberfläche) =====================
  const AREAS = TEMPLES.map((t) => t.id);
  const CFG_DEF = {
    mode: "auto", anteil: 40, sicher: "4in5", textShare: 40, lock: false,
    detektiv: true, frustN: 3, uebTag: true, retry: true,
    fx: true, vol: "mittel", speech: true, readBtn: true, name: "", titel: "f",
    rewardEvery: 5, goldEvery: 50, mythen: true,
  };
  const CFG_RULE = {
    mode: ["auto", "manual"], sicher: ["3in3", "4in5", "9in10"], frustN: [0, 2, 3, 4, 5], vol: ["leise", "mittel", "laut"],
    titel: ["f", "m"], rewardEvery: [3, 5, 10], goldEvery: [0, 50, 100],
  };
  const DATA_GEN = 1;
  const freshAreas = () => Object.fromEntries(AREAS.map((a) => [a, true]));
  const freshState = () => ({
    gen: DATA_GEN, sound: true, cfg: { ...CFG_DEF }, areas: freshAreas(), station: "",
    stufe: 2, lvl: "", lvlSince: 0,
    correct: 0, sincePup: 0, goldN: 0, bag: [], lastPup: "", pups: {}, treasures: [], docs: [], tg: {}, rank: 0,
    stats: {}, days: {}, err: {}, seq: 0, recentT: [], savedAt: 0,
  });
  let state = freshState();

  const int = (v, lo, hi) => (Number.isInteger(v) && v >= lo && v <= hi ? v : null);
  const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  function cleanCfg(raw) {
    const c = { ...CFG_DEF };
    if (!raw || typeof raw !== "object") return c;
    for (const k of Object.keys(CFG_DEF)) {
      const v = raw[k], d = CFG_DEF[k];
      if (typeof d === "boolean") { if (typeof v === "boolean") c[k] = v; }
      else if (k === "name") { if (typeof v === "string") c[k] = v.replace(/[^\p{L}\p{M} '’-]/gu, "").trim().slice(0, 20); }
      else if (k === "anteil") { if (Number.isFinite(v)) c[k] = Math.max(10, Math.min(60, Math.round(v / 5) * 5)); }
      else if (k === "textShare") { if (Number.isFinite(v)) c[k] = Math.max(0, Math.min(100, Math.round(v / 10) * 10)); }
      else if (CFG_RULE[k] && CFG_RULE[k].includes(v)) c[k] = v;
    }
    return c;
  }
  function cleanStats(raw) {
    const out = {};
    if (!raw || typeof raw !== "object") return out;
    for (const id of Object.keys(raw)) {
      const e = raw[id];
      if (!SKILL_BY_ID[id] || !e || typeof e !== "object") continue;
      out[id] = {
        h: typeof e.h === "string" && /^[0-3]*$/.test(e.h) ? e.h.slice(-10) : "",
        n: int(e.n, 0, 1e6) ?? 0, c: int(e.c, 0, 1e6) ?? 0, l: int(e.l, 0, 1e9) ?? 0,
        w: e.w ? 1 : 0, g: int(e.g, 0, 3) ?? 0,
        sd: Array.isArray(e.sd) ? e.sd.filter((x) => typeof x === "string" && DAY_RE.test(x)).slice(-3) : [],
      };
    }
    return out;
  }
  const PUP_IDS = () => PUPS.map((p) => p.id);
  // Prüft alles, was von außen kommt (Browser, Konto, Spielstand-Code), und füllt Lücken mit Standardwerten
  function sanitize(raw) {
    if (!raw || typeof raw !== "object") return null;
    const o = freshState();
    if (typeof raw.sound === "boolean") o.sound = raw.sound;
    o.cfg = cleanCfg(raw.cfg);
    if (raw.areas && typeof raw.areas === "object") { const a = {}; AREAS.forEach((k) => { a[k] = raw.areas[k] !== false; }); if (Object.values(a).some(Boolean)) o.areas = a; }
    if (typeof raw.station === "string" && (raw.station === "" || AREAS.includes(raw.station))) o.station = raw.station;
    o.stufe = int(raw.stufe, 1, 5) ?? 2;
    o.lvl = typeof raw.lvl === "string" && /^[0-3]*$/.test(raw.lvl) ? raw.lvl.slice(-20) : "";
    o.lvlSince = int(raw.lvlSince, 0, 1e6) ?? 0;
    o.correct = int(raw.correct, 0, 1e7) ?? 0;
    o.sincePup = int(raw.sincePup, 0, 99) ?? 0;
    o.goldN = int(raw.goldN, 0, 1e5) ?? 0;
    const ids = new Set(PUP_IDS());
    o.bag = Array.isArray(raw.bag) ? [...new Set(raw.bag.filter((x) => ids.has(x)))] : [];
    o.lastPup = ids.has(raw.lastPup) ? raw.lastPup : "";
    if (raw.pups && typeof raw.pups === "object") for (const id of Object.keys(raw.pups)) {
      const e = raw.pups[id];
      if (ids.has(id) && e && typeof e === "object") o.pups[id] = { n: int(e.n, 0, 1e5) ?? 1, g: int(e.g, 0, 1e5) ?? 0 };
    }
    o.treasures = Array.isArray(raw.treasures) ? raw.treasures.filter((x) => TREASURE_BY_ID[x]).slice(0, 200) : [];
    o.docs = Array.isArray(raw.docs) ? raw.docs.filter((d) => d && typeof d === "object" && ["grade", "rank"].includes(d.t)).slice(-100).map((d) => ({
      t: d.t, a: AREAS.includes(d.a) ? d.a : "", g: int(d.g, 0, 3) ?? 0, r: int(d.r, 0, RANKS.length - 1) ?? 0, d: typeof d.d === "string" && DAY_RE.test(d.d) ? d.d : "",
    })) : [];
    if (raw.tg && typeof raw.tg === "object") AREAS.forEach((a) => { const g = int(raw.tg[a], 0, 3); if (g) o.tg[a] = g; });
    o.rank = int(raw.rank, 0, RANKS.length - 1) ?? 0;
    o.stats = cleanStats(raw.stats);
    if (raw.days && typeof raw.days === "object") Object.keys(raw.days).filter((k) => DAY_RE.test(k)).sort().slice(-120).forEach((k) => {
      const v = raw.days[k]; if (Array.isArray(v) && int(v[0], 0, 1e5) !== null && int(v[1], 0, 1e5) !== null) o.days[k] = [v[0], v[1]];
    });
    if (raw.err && typeof raw.err === "object") for (const k of Object.keys(raw.err)) { const v = int(raw.err[k], 0, 1e6); if (v && /^[a-z]{2,6}$/.test(k)) o.err[k] = v; }
    o.seq = int(raw.seq, 0, 1e9) ?? 0;
    o.recentT = Array.isArray(raw.recentT) ? raw.recentT.filter((x) => typeof x === "string").slice(-30) : [];
    o.savedAt = typeof raw.savedAt === "number" && raw.savedAt > 0 ? raw.savedAt : 0;
    return o;
  }

  // ---------- Lernstand je Aufgabenart ----------
  const RULES = { "3in3": { k: 3, n: 3 }, "4in5": { k: 4, n: 5 }, "9in10": { k: 9, n: 10 } };
  const isOk = (ch) => ch === "2" || ch === "3";   // 3 = beim 1. Versuch, 2 = ohne Hilfe, 1 = mit Hilfe, 0 = Lösung gezeigt
  function statusOf(id) {
    const st = state.stats[id], h = st ? st.h : "";
    const r = RULES[state.cfg.sicher] || RULES["4in5"];
    const last = h.slice(-r.n), okc = [...last].filter(isOk).length;
    if (last.length >= r.k && okc >= r.k && (last.length === r.n || okc === last.length)) return "sicher";
    if (st && st.w) return "wackelig";
    return h.length < 3 ? "neu" : "uebend";
  }
  const rateOf = (id) => { const st = state.stats[id], l = st ? st.h.slice(-5) : ""; return l.length ? [...l].filter(isOk).length / l.length : 0.5; };
  const rate10 = (id) => { const st = state.stats[id], l = st ? st.h.slice(-10) : ""; return l.length >= 5 ? [...l].filter(isOk).length / l.length : rateOf(id); };
  const needsPractice = (id) => { const st = statusOf(id); return st === "uebend" || st === "wackelig" || (st === "sicher" && rate10(id) < 0.7); };
  const sinceSeen = (id) => { const st = state.stats[id]; return st && st.l ? state.seq - st.l : 999; };
  const clock = { day: null };
  const todayKey = () => {
    if (clock.day) return clock.day;
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };

  // ---------- Auswahl: kurzes Gedächtnis dieser Sitzung ----------
  const mem = { recent: [], skills: [], areas: [], hard: [], codes: [], miss: 0, streak: 0, retry: [], cool: 0, easy: 0, last: "" };
  const taskKey = (t) => t.kind === "text" ? t.tid + "|" + t.story.replace(/\D+/g, ",") : t.skill + "|" + t.eq;
  const isHard = (s) => s.lv >= Math.max(3, state.stufe) || s.lv >= 4;

  function enabledSkills() {
    const st = state.station && state.areas[state.station] ? state.station : "";
    const ok = (s) => s.lv <= state.stufe && (st ? s.area === st : state.areas[s.area]);
    const on = SKILLS.filter(ok);
    return on.length ? on : SKILLS.filter((s) => s.lv <= state.stufe && state.areas[s.area]).concat([SKILL_BY_ID.t_sach]);
  }
  function wpick(items, wf) {
    const ws = items.map(wf), tot = ws.reduce((x, y) => x + y, 0);
    if (!(tot > 0)) return pick(items);
    let r = Math.random() * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r < 0) return items[i]; }
    return items[items.length - 1];
  }
  function needScore(s) {
    const status = statusOf(s.id), rate = rateOf(s.id);
    let w = status === "neu" ? 1.5 : 1 + 3 * (1 - Math.min(rate, rate10(s.id))) + (status === "wackelig" ? 1.5 : 0);
    const since = sinceSeen(s.id);
    w *= since < 4 ? 0.3 : since > 25 ? 1.25 : 1;
    return w * w;
  }
  function mixWeight(s) {
    const status = statusOf(s.id);
    let w = status === "neu" ? 1.5 : status === "wackelig" ? 1.2 : status === "sicher" ? (rate10(s.id) < 0.8 ? 0.8 : sinceSeen(s.id) > 60 ? 1.2 : 0.35) : 1;
    if (s.lv === state.stufe) w *= 1.4;   // Neues dieser Stufe etwas öfter
    if (sinceSeen(s.id) < 3) w *= 0.3;
    return w;
  }
  function easyPool(skills) {
    let p = skills.filter((s) => statusOf(s.id) === "sicher");
    if (!p.length) p = skills.filter((s) => !isHard(s) && rateOf(s.id) >= 0.6);
    if (!p.length) p = skills.filter((s) => !isHard(s));
    return p.length ? p : skills;
  }
  function avoidNow(skills) {
    const L = mem.skills, n = L.length, A = mem.areas, H = mem.hard;
    const areas = new Set(skills.map((s) => s.area));
    return {
      skills: new Set(n >= 2 && L[n - 1] === L[n - 2] ? [L[n - 1]] : n >= 1 && SKILL_BY_ID[L[n - 1]] && SKILL_BY_ID[L[n - 1]].area !== "text" ? [L[n - 1]] : []),
      area: A.length >= 3 && A.slice(-3).every((o) => o === A[A.length - 1]) && areas.size > 1 ? A[A.length - 1] : null,
      hard: H.length >= 3 && H.slice(-3).every(Boolean) && skills.some((s) => !isHard(s)),
      hard2: H.length >= 2 && H.slice(-2).every(Boolean),
    };
  }
  const allowed = (list, av) => list.filter((s) => !av.skills.has(s.id) && s.area !== av.area && !(av.hard && isHard(s)));

  // Textanteil: Ohne Station wird zuerst entschieden, ob eine Geschichte oder eine Rechenaufgabe kommt.
  function splitText(skills) {
    if (state.station) return skills;
    const tx = skills.filter((s) => s.area === "text"), other = skills.filter((s) => s.area !== "text");
    if (!tx.length || !other.length) return skills;
    return Math.random() < state.cfg.textShare / 100 ? tx : other;
  }
  function decidePool(skills, plan) {
    const auto = state.cfg.mode === "auto", av = avoidNow(skills);
    if (plan === "easy") return { pool: "erfolg", av };
    if (auto) {
      const ueb = allowed(skills.filter((s) => needsPractice(s.id)), av);
      if (ueb.length && Math.random() < state.cfg.anteil / 100) return { pool: "ueb", ueb, av };
    }
    return { pool: "mix", wantHard: !av.hard2 && Math.random() < 0.4, av };
  }
  function drawSkill(skills, d) {
    if (d.pool === "erfolg") { const e = allowed(easyPool(skills), d.av); return wpick(e.length ? e : easyPool(skills), (x) => 0.5 + rateOf(x.id)); }
    if (d.pool === "ueb") return wpick(d.ueb, needScore);
    const ok = allowed(skills, d.av), base = ok.length ? ok : skills;
    let cand = base.filter((s) => isHard(s) === d.wantHard);
    if (!cand.length) cand = base;
    return wpick(cand, state.cfg.mode === "auto" ? mixWeight : () => 1);
  }
  function acceptable(t, relax) {
    const win = [40, 12, 3][relax];
    return !mem.recent.slice(-win).includes(taskKey(t));
  }
  function makeFor(s) {
    const t = s.make(state.stufe, state.recentT);
    t.skill = s.id; t.area = s.area; t.hard = s.area === "text" ? t.tlevel === 3 : isHard(s);
    return t;
  }
  function commit(t) {
    mem.recent.push(taskKey(t)); mem.skills.push(t.skill); mem.areas.push(t.area); mem.hard.push(t.hard);
    for (const k of ["recent", "skills", "areas", "hard"]) if (mem[k].length > 80) mem[k].shift();
    if (t.tid) { state.recentT = [...state.recentT.filter((x) => x !== t.tid), t.tid].slice(-30); }
  }
  function nextTask() {
    mem.cool = Math.max(0, mem.cool - 1);
    const all = enabledSkills();
    let plan = "normal", retry = null;
    const av = avoidNow(all);
    const di = state.cfg.retry ? mem.retry.findIndex((r) => r.due <= state.seq && all.some((s) => s.id === r.skill) && allowed([SKILL_BY_ID[r.skill]], av).length) : -1;
    if (mem.easy > 0) { plan = "easy"; mem.easy--; }
    else if (di >= 0 && Math.random() < 0.85) { plan = "retry"; retry = mem.retry.splice(di, 1)[0]; }
    else if (state.cfg.mode === "auto" && mem.miss >= 2) plan = "easy";
    const skills = plan === "retry" ? all : splitText(all);
    const decided = plan === "retry" ? null : decidePool(skills, plan);
    let chosen = null, lastT = null;
    for (let attempt = 0; attempt < 40; attempt++) {
      const relax = attempt < 16 ? 0 : attempt < 30 ? 1 : 2;
      const t = plan === "retry" ? makeFor(SKILL_BY_ID[retry.skill]) : makeFor(drawSkill(skills, decided));
      t.pool = plan === "retry" ? "retry" : decided.pool; if (plan === "retry") t.retried = true;
      lastT = t;
      if (acceptable(t, relax)) { chosen = t; break; }
    }
    const t = chosen || lastT;
    commit(t);
    return t;
  }

  // ---------- Ergebnis festhalten ----------
  // code: 3 = beim 1. Versuch, 2 = ohne Hilfe, 1 = mit Hilfe (Schritte), 0 = Lösung gezeigt
  function recordResult(t, code) {
    const id = t.skill, out = { grade: null, rank: null, stufe: 0 };
    const st = state.stats[id] || (state.stats[id] = { h: "", n: 0, c: 0, l: 0, w: 0, g: 0, sd: [] });
    st.h = (st.h + code).slice(-10); st.n++;
    if (code >= 2) st.c++;
    st.l = ++state.seq;
    const day = todayKey(), d = state.days[day] || (state.days[day] = [0, 0]);
    d[0]++; if (code >= 2) d[1]++;
    const keys = Object.keys(state.days).sort();
    if (keys.length > 120) keys.slice(0, keys.length - 120).forEach((k) => delete state.days[k]);
    if (statusOf(id) === "sicher") { st.w = 1; if (!st.sd.includes(day)) st.sd = [...st.sd, day].slice(-3); }
    mem.codes.push(code); if (mem.codes.length > 30) mem.codes.shift();
    mem.miss = code === 0 ? mem.miss + 1 : 0;   // Schritte nutzen ist kein Misserfolg, nur das Zeigen der Lösung
    mem.streak = code >= 2 ? mem.streak + 1 : 0;
    if (code <= 1 && state.cfg.retry && !t.retried) mem.retry.push({ skill: id, due: state.seq + R(5, 8) });
    // Grad je Aufgabenart: 1 = 3 ohne Hilfe, 2 = sicher, 3 = an zwei Tagen sicher. Er sinkt nie.
    let g = st.c >= 3 ? 1 : 0;
    if (st.w) g = 2;
    if (st.sd.length >= 2) g = 3;
    if (g > st.g) st.g = g;
    // Tempelgrad und Laufbahn
    const tg = templeGradeCalc(t.area);
    if (tg > (state.tg[t.area] || 0)) { state.tg[t.area] = tg; out.grade = { a: t.area, g: tg }; state.docs.push({ t: "grade", a: t.area, g: tg, r: 0, d: day }); }
    const rk = rankCalc();
    if (rk > state.rank) { state.rank = rk; out.rank = rk; state.docs.push({ t: "rank", a: "", g: 0, r: rk, d: day }); }
    out.stufe = stufeStep(code);
    return out;
  }

  // Tempelgrad aus den Graden seiner Aufgabenarten: Novizin, Priesterin, Hohepriesterin
  function templeGradeCalc(area) {
    const list = SKILLS_OF(area), n = list.length, gs = list.map((s) => (state.stats[s.id] ? state.stats[s.id].g : 0));
    const cnt = (k) => gs.filter((g) => g >= k).length;
    if (cnt(3) >= Math.ceil(n * 0.6)) return 3;
    if (cnt(2) >= Math.ceil(n * 0.35)) return 2;
    if (cnt(1) >= Math.min(2, n)) return 1;
    return 0;
  }
  const rankPoints = () => AREAS.reduce((s, a) => s + (state.tg[a] || 0), 0);
  function rankCalc() { let r = 0; RANKS.forEach((x, i) => { if (rankPoints() >= x.min) r = i; }); return r; }

  // Stufe: steigt nach 15 Aufgaben mit mindestens 12 ohne Hilfe, sinkt nach 10 Aufgaben mit höchstens 4 ohne Hilfe
  function stufeStep(code) {
    state.lvl = (state.lvl + code).slice(-20); state.lvlSince++;
    if (state.cfg.lock || state.cfg.mode !== "auto" || state.station) return 0;
    const last = (n) => state.lvl.slice(-n), okc = (s) => [...s].filter(isOk).length;
    if (state.lvlSince >= 15 && state.stufe < 5 && okc(last(15)) >= 12) { state.stufe++; state.lvl = ""; state.lvlSince = 0; return 1; }
    if (state.lvlSince >= 10 && state.stufe > 1 && okc(last(10)) <= 4) { state.stufe--; state.lvl = ""; state.lvlSince = 0; return -1; }
    return 0;
  }

  // ---------- Belohnungen zählen: Welpen alle N, Gold alle G (abwechselnd Gold-Welpe und Goldschatz) ----------
  function nextPup() {
    const ids = PUP_IDS();
    if (!ids.length) return null;
    if (!state.bag.length) {
