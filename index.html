  }
  function detail(title, art, text, btns = []) {
    $("detailTitle").textContent = title; $("detailArt").innerHTML = art; $("detailText").innerHTML = text;
    const box = $("detailBtns"); box.innerHTML = "";
    [...btns, ["Zurück", null]].forEach(([label, fn]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = fn ? "big-btn" : "link-btn"; b.textContent = label;
      b.addEventListener("click", () => { $("detail").hidden = true; if (fn) fn(); });
      box.append(b);
    });
    $("detail").hidden = false; box.firstChild.focus();
  }

  // ---------- Tempel wählen ----------
  function setStation(id) {
    state.station = id; save();
    ["coll", "temples", "detail"].forEach((x) => { $(x).hidden = true; });
    renderProgress(); newTask();
  }
  $("templeBtn").addEventListener("click", () => {
    $("templeGrid").innerHTML = `<button type="button" class="temple-card${state.station ? "" : " on"}" data-pick=""><span class="tc-god auto"><svg viewBox="-12 -18 24 38" aria-hidden="true">${ankh(0, 0, 1.3, "var(--gold-bright)")}</svg></span><span class="tc-text"><b>Automatik</b><small>Alle Tempel gemischt, die App wählt nach deinem Lernstand.</small></span></button>` +
      TEMPLES.filter((t) => state.areas[t.id]).map((t) => `<button type="button" class="temple-card${state.station === t.id ? " on" : ""}" data-pick="${t.id}">
        <span class="tc-god">${godSVG(t.god)}</span><span class="tc-text"><b>${GODS[t.god].name}</b><small>${t.area}</small></span><span class="tc-seal">${sealSVG(t.id, state.tg[t.id] || 0)}</span></button>`).join("");
    $("temples").hidden = false; $("templesClose").focus();
  });
  $("templeGrid").addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) setStation(b.dataset.pick); });
  $("templesClose").addEventListener("click", () => { $("temples").hidden = true; });
  $("stufeBadge").addEventListener("click", () => detail(`Stufe ${STUFEN[state.stufe]}`, `<div class="stone-tile s${state.stufe}"><span>${STUFEN[state.stufe]}</span></div>`,
    `<p>Es gibt fünf Stufen: ${STUFEN.slice(1).join(", ")}. Je sicherer du rechnest, desto höher steigst du, wie beim Bau einer Pyramide.</p>`));

  // ---------- Klicks und Tasten ----------
  function closeTop() {
    if (!$("detail").hidden) { $("detail").hidden = true; return; }
    if (!$("doc").hidden) { $("docClose").click(); return; }
    if (!$("reward").hidden) { closeReward(); return; }
    if (!$("temples").hidden) { $("temples").hidden = true; return; }
    if (!$("coll").hidden) { $("collClose").click(); return; }
    if (!$("parents").hidden) { $("parentsClose").click(); }
  }
  ["reward", "doc", "coll", "detail", "temples", "parents"].forEach((id) => $(id).addEventListener("click", (e) => { if (e.target.id === id) closeTop(); }));
  document.addEventListener("click", (e) => {
    if (!ui) return;
    const slot = e.target.closest("[data-slot]");
    if (slot) { const id = slot.dataset.slot, ok = id === "main" ? !ui.solved : +id.slice(1) === ui.stepIdx; if (ok) { ui.active = id; render(); } return; }
    const ch = e.target.closest("[data-choice]");
    if (ch && !ch.disabled) { pickChoice(ch.dataset.choice, ch.dataset.val); return; }
    const of = e.target.closest("[data-offer]");
    if (of) { offerAnswered(of.dataset.offer === "1"); ui.offer = false; render(); return; }
    if (e.target.closest("#splitBtn")) { toggleHelper(); return; }
    if (e.target.closest("#readBtn")) { speak(sayable(task.kind === "text" ? task.story + " " + task.question : (task.prompt || "") + " " + task.eq), true); return; }
    if (e.target.closest("#nextBtn")) next();
  });
  const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "sep", "0", "del", "ok"];
  $("pad").innerHTML = KEYS.map((k) => k === "del" ? `<button class="key del" type="button" data-k="del" aria-label="Löschen">Löschen</button>`
    : k === "ok" ? `<button class="key ok" type="button" data-k="ok">Prüfen</button>`
    : k === "sep" ? `<button class="key sep" type="button" data-k="sep" id="sepKey" aria-label="Komma, Punkt, Bruchstrich oder Rest">,</button>`
    : `<button class="key" type="button" data-k="${k}">${k}</button>`).join("");
  $("pad").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (!b) return; const k = b.dataset.k; if (k === "del") del(); else if (k === "ok") check(); else typeChar(k); });
  document.addEventListener("keydown", (e) => {
    if (overlayOpen()) { if (e.key === "Escape") closeTop(); return; }
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.ctrlKey || e.metaKey || e.altKey || !ui) return;
    if (/^[0-9]$/.test(e.key)) typeChar(e.key);
    else if ([",", ".", ":", "/", "r", "R"].includes(e.key)) typeChar("sep");
    else if (e.key === "Backspace") { e.preventDefault(); del(); }
    else if (e.key === "Enter") {
      if (e.target.closest && e.target.closest("button") && !e.target.closest("[data-slot]") && !e.target.closest("#pad")) return;
      e.preventDefault(); check();
    }
  });
  $("soundBtn").addEventListener("click", () => { state.sound = !state.sound; if (!state.sound && hasSpeech) { try { window.speechSynthesis.cancel(); } catch (e) { /* egal */ } } save(); syncTop(); });

  // ---------- Eltern-Menü ----------
  let dirtyTask = false;
  const STATUS_WORD = { neu: "neu", uebend: "übt noch", sicher: "sicher", wackelig: "wackelt" };
  const opt = (v, cur, label) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${label}</option>`;
  const chk = (key, label, note) => `<label class="row-check"><input type="checkbox" id="cfg-${key}" data-cfg="${key}"${state.cfg[key] ? " checked" : ""}><span>${label}${note ? `<small>${note}</small>` : ""}</span></label>`;
  function renderParents() {
    const c = state.cfg, last7 = Object.keys(state.days).sort().slice(-7), wk = last7.reduce((s, k) => s + state.days[k][0], 0), wkOk = last7.reduce((s, k) => s + state.days[k][1], 0);
    const standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const lern = TEMPLES.map((t) => {
      const rows = SKILLS_OF(t.id).filter((s) => s.lv <= Math.max(state.stufe, 1)).map((s) => {
        const st = statusOf(s.id), n = state.stats[s.id] ? state.stats[s.id].n : 0;
        return `<li><span>${esc(s.label)} <small>${esc(s.ex)}</small></span><span class="pill ${st}">${STATUS_WORD[st]}${n ? ` · ${Math.round(rate10(s.id) * 100)} %` : ""}</span></li>`;
      }).join("");
      return `<details><summary>${GODS[t.god].name}: ${t.area} <small>${state.tg[t.id] ? gradeName(state.tg[t.id]) : ""}</small></summary><ul class="lern">${rows || "<li>Noch keine Aufgabenarten auf dieser Stufe.</li>"}</ul></details>`;
    }).join("");
    $("parentsBody").innerHTML = `
      <section class="psec"><h3>Aufgaben</h3>
        <p class="note">Welche Tempel sind im Spiel? Abgeschaltete Bereiche kommen nicht dran, auch nicht in der Automatik.</p>
        <div class="area-grid">${TEMPLES.map((t) => `<label class="row-check"><input type="checkbox" id="area-${t.id}" data-area="${t.id}"${state.areas[t.id] ? " checked" : ""}><span>${t.area}<small>Tempel ${godArticle(t.god)} ${GODS[t.god].name}</small></span></label>`).join("")}</div>
        <label class="row-range" for="cfg-textShare"><span>Anteil Textaufgaben: <b id="textShareVal">${c.textShare} %</b></span><input type="range" id="cfg-textShare" data-cfg-range="textShare" min="0" max="100" step="10" value="${c.textShare}"></label>
      </section>
      <section class="psec"><h3>Stufe und Automatik</h3>
        <p>Jetzt: <b>Stufe ${state.stufe} · ${STUFEN[state.stufe]}</b>${c.lock ? " (festgehalten)" : ""}. ${state.station ? `Sie rechnet gerade nur im Tempel ${godArticle(TEMPLE_BY_ID[state.station].god)} ${GODS[TEMPLE_BY_ID[state.station].god].name}; die Stufe bewegt sich dabei nicht.` : ""}</p>
        <div class="seg" role="group" aria-label="Stufe festlegen">${[1, 2, 3, 4, 5].map((s) => `<button type="button" class="segb${s === state.stufe ? " on" : ""}" data-stufe="${s}">${s} ${STUFEN[s]}</button>`).join("")}</div>
        ${chk("lock", "Stufe festhalten", "Die Automatik ändert die Stufe dann nicht mehr.")}
        <label class="row-check"><input type="checkbox" id="cfg-mode" data-cfg-mode${c.mode === "auto" ? " checked" : ""}><span>Automatik<small>Wählt Aufgaben nach dem Lernstand und passt die Stufe an: steigt nach 15 Aufgaben mit mindestens 12 ohne Hilfe, sinkt nach 10 Aufgaben mit höchstens 4 ohne Hilfe.</small></span></label>
        <label class="row-range" for="cfg-anteil"><span>Anteil Übungsaufgaben aus den Schwächen: <b id="anteilVal">${c.anteil} %</b></span><input type="range" id="cfg-anteil" data-cfg-range="anteil" min="10" max="60" step="5" value="${c.anteil}"></label>
        <label class="row-sel" for="cfg-sicher">Sicher heißt <select id="cfg-sicher" data-cfg-sel="sicher">${opt("3in3", c.sicher, "3 richtig hintereinander")}${opt("4in5", c.sicher, "4 von 5 ohne Hilfe")}${opt("9in10", c.sicher, "9 von 10 ohne Hilfe")}</select></label>
      </section>
      <section class="psec"><h3>Hilfen</h3>
        ${chk("detektiv", "Fehler-Detektiv", "Erkennt Flüchtigkeitsfehler (falsches Zeichen, vertauschte Ziffern, Zehner vergessen) und gibt einen Hinweis.")}
        ${chk("uebTag", "Zeichen „Übung“ an Übungsaufgaben")}
        ${chk("retry", "Nicht gelöste Aufgabenarten nach 5 bis 8 Aufgaben wiederholen")}
        <label class="row-sel" for="cfg-frustN">Leichtere Aufgabe anbieten nach <select id="cfg-frustN" data-cfg-sel="frustN">${[0, 2, 3, 4, 5].map((n) => opt(n, c.frustN, n ? `${n} gezeigten Lösungen in Folge` : "nie")).join("")}</select></label>
        <p class="note">„In Schritte zerlegen“ zählt für Welpen und Gold voll. Für die Automatik gilt die Aufgabe als „mit Hilfe“.</p>
      </section>
      <section class="psec"><h3>Belohnungen</h3>
        <label class="row-sel" for="cfg-rewardEvery">Ein Welpe alle <select id="cfg-rewardEvery" data-cfg-sel="rewardEvery">${[3, 5, 10].map((n) => opt(n, c.rewardEvery, `${n} Aufgaben`)).join("")}</select></label>
        <label class="row-sel" for="cfg-goldEvery">Gold alle <select id="cfg-goldEvery" data-cfg-sel="goldEvery">${[0, 50, 100].map((n) => opt(n, c.goldEvery, n ? `${n} Aufgaben` : "nie")).join("")}</select></label>
        ${chk("mythen", "Kleine Geschichten aus den Mythen zeigen", "Kindgerecht erzählt, zum Beispiel wie Isis die Teile wieder zusammenfügt.")}
        <p class="note">${PUPS.length} Welpenfotos, keines doppelt, bevor alle einmal dran waren. ${PUPS.filter((p) => !p.credit).length ? `${PUPS.filter((p) => !p.credit).length} davon sind Übergangsfotos ohne freie Lizenz.` : "Alle Fotos sind gemeinfrei oder CC0 (Wikimedia Commons)."}</p>
      </section>
      <section class="psec"><h3>Name, Ton und Sprache</h3>
        <label class="row-text" for="cfg-name">Name für Kartusche, Urkunden und Lob <input id="cfg-name" type="text" maxlength="20" autocomplete="off" value="${esc(c.name)}" placeholder="Name"></label>
        <p class="note">In Hieroglyphen: <span class="cartouche" id="namePreview">${hieroName(c.name) || "…"}</span> Eine Annäherung: Die Ägypter schrieben keine Vokale wie wir. Der Name bleibt nur auf diesem Gerät.</p>
        <label class="row-sel" for="cfg-titel">Anrede <select id="cfg-titel" data-cfg-sel="titel">${opt("f", c.titel, "Priesterin, Pharaonin")}${opt("m", c.titel, "Priester, Pharao")}</select></label>
        ${chk("fx", "Klänge")}
        <label class="row-sel" for="cfg-vol">Lautstärke <select id="cfg-vol" data-cfg-sel="vol">${opt("leise", c.vol, "leise")}${opt("mittel", c.vol, "mittel")}${opt("laut", c.vol, "laut")}</select></label>
        ${chk("speech", "Gesprochenes Lob", hasSpeech ? "Die Stimme kommt vom Gerät." : "Dieses Gerät hat keine Sprachausgabe.")}
        ${chk("readBtn", "Knopf „Vorlesen“ bei Textaufgaben")}
      </section>
      <section class="psec"><h3>Lernstand</h3>
        <p>Letzte 7 Tage: <b>${wk}</b> Aufgaben, davon <b>${wkOk}</b> ohne Hilfe. Insgesamt <b>${state.correct}</b> gelöst. Laufbahn: <b>${rankName(state.rank)}</b>.</p>
        ${lern}
      </section>
      <section class="psec"><h3>Spielstand</h3>
        <p class="note" id="saveStatus"></p>
        <div class="btn-row"><button class="btn go" id="backupBtn" type="button">Sicherung speichern</button><button class="btn" id="codeShowBtn" type="button">Code anzeigen</button><button class="btn" id="codeEnterBtn" type="button">Code eingeben</button></div>
        <p class="note" id="backupMsg" role="status"></p>
        <div id="codeBox" hidden><textarea id="codeOut" rows="3" readonly aria-label="Spielstand-Code"></textarea><button class="link-btn" id="codeCopyBtn" type="button">Kopieren</button> <span class="note" id="codeCopyMsg"></span></div>
        <div id="codeInBox" hidden><label class="note" for="codeIn">Spielstand-Code hier einfügen:</label><textarea id="codeIn" rows="3" placeholder="RZ1.…" autocomplete="off" spellcheck="false"></textarea>
          <button class="btn" id="codeLoadBtn" type="button">Laden</button><p class="note" id="codeInMsg"></p>
          <div id="codeConfirm" hidden><p id="codeConfirmText"></p><button class="btn go" id="codeYes" type="button">Ja, laden</button> <button class="link-btn" id="codeNo" type="button">Abbrechen</button></div></div>
        <div class="reset-row" id="resetRow"><button class="link-btn" id="resetBtn" type="button">Alles zurücksetzen (Fortschritt, Schätze, Lernstand)</button></div>
      </section>
      ${!standalone && !inClaude() ? `<section class="psec"><h3>Auf den Home-Bildschirm</h3><p class="note">iPhone und iPad: In Safari auf das Teilen-Symbol (Quadrat mit Pfeil) tippen, dann „Zum Home-Bildschirm“. Danach immer über das neue Symbol starten. Die App läuft dann auch ohne Internet.</p></section>` : ""}
      <p class="note">Rechenzeitreise ${VERSION}</p>`;
    renderSaveStatus();
  }
  const clockTime = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const backupAt = () => { try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; } };
  function markBackup() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) { /* egal */ } renderSaveStatus(); }
  function renderSaveStatus() {
    const el = $("saveStatus"); if (!el) return;
    const when = state.savedAt ? ` Zuletzt gespeichert um ${clockTime(state.savedAt)} Uhr.` : "";
    let t;
    if (cloud.status === "on") t = "Wird automatisch in deinem Claude-Konto gespeichert und ist auf jedem Gerät gleich, auf dem du mit diesem Konto angemeldet bist." + when;
    else if (!localOk) t = "Dieser Browser speichert gerade nichts (zum Beispiel im privaten Fenster). Sichere den Fortschritt mit dem Code.";
    else t = "Wird automatisch auf diesem Gerät gespeichert." + when + " Für ein anderes Gerät oder als Sicherung: „Sicherung speichern“.";
    if (cloud.status !== "on") {
      const b = backupAt(), days = b ? Math.floor((Date.now() - b) / 864e5) : 0;
      t += b ? ` Letzte Sicherung: ${days === 0 ? "heute" : days === 1 ? "gestern" : "vor " + days + " Tagen"}.` : " Noch nie gesichert.";
      if (state.correct >= 30 && (!b || days >= 14)) t += " Es ist Zeit für eine Sicherung.";
    }
    el.textContent = t;
  }
  function openParents() { renderParents(); $("parents").hidden = false; $("parentsClose").focus(); }
  function closeParents() { $("parents").hidden = true; if (dirtyTask) { dirtyTask = false; newTask(); } }
  $("parentsBtn").addEventListener("click", openParents);
  $("parentsClose").addEventListener("click", closeParents);
  const pb = $("parentsBody");
  pb.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.cfg) { state.cfg[t.dataset.cfg] = t.checked; dirtyTask = dirtyTask || t.dataset.cfg === "mode"; }
    else if ("cfgMode" in t.dataset) { state.cfg.mode = t.checked ? "auto" : "manual"; dirtyTask = true; }
    else if (t.dataset.cfgSel) { const k = t.dataset.cfgSel, v = CFG_RULE[k].find((x) => String(x) === t.value); if (v !== undefined) state.cfg[k] = v; if (k === "rewardEvery") state.sincePup = Math.min(state.sincePup, v - 1); }
    else if (t.dataset.area) {
      const nx = { ...state.areas, [t.dataset.area]: t.checked };
      if (!Object.values(nx).some(Boolean)) { t.checked = true; return; }
      state.areas = nx; if (state.station && !nx[state.station]) state.station = ""; dirtyTask = true;
    } else return;
    save(); syncTop(); renderProgress();
  });
  pb.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.cfgRange) { const k = t.dataset.cfgRange; state.cfg[k] = Number(t.value); $(k + "Val").textContent = t.value + " %"; dirtyTask = true; save(); }
    if (t.id === "cfg-name") { state.cfg.name = cleanCfg({ name: t.value }).name; $("namePreview").textContent = hieroName(state.cfg.name) || "…"; save(); syncTop(); }
  });
  pb.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.stufe) { state.stufe = +b.dataset.stufe; state.lvl = ""; state.lvlSince = 0; dirtyTask = true; save(); renderProgress(); renderParents(); return; }
    const id = b.id;
    if (id === "backupBtn") {
      const code = exportCode(), msg = $("backupMsg");
      try { if (navigator.share) { await navigator.share({ title: "Rechenzeitreise Spielstand", text: code }); markBackup(); msg.textContent = "Gesichert. Bewahre die Notiz oder Nachricht gut auf."; return; } }
      catch (err) { if (err && err.name === "AbortError") { msg.textContent = "Abgebrochen. Es wurde nichts gesichert."; return; } }
      try { await navigator.clipboard.writeText(code); markBackup(); msg.textContent = "Code kopiert. Jetzt in einer Notiz einfügen und aufbewahren."; }
      catch (err) { $("codeShowBtn").click(); msg.textContent = "Kopiere den Code unten und bewahre ihn auf."; }
    } else if (id === "codeShowBtn") { $("codeInBox").hidden = true; $("codeOut").value = exportCode(); $("codeBox").hidden = false; $("codeOut").select(); }
    else if (id === "codeCopyBtn") {
      const done = () => { $("codeCopyMsg").textContent = "Kopiert."; markBackup(); }, fb = () => { $("codeOut").select(); $("codeCopyMsg").textContent = "Markiert. Jetzt kopieren."; };
      try { navigator.clipboard.writeText($("codeOut").value).then(done, fb); } catch (err) { fb(); }
    } else if (id === "codeEnterBtn") { $("codeBox").hidden = true; $("codeInBox").hidden = false; $("codeIn").focus(); }
    else if (id === "codeLoadBtn") {
      const nx = parseCode($("codeIn").value);
      if (!nx) { $("codeInMsg").textContent = "Dieser Code passt nicht. Er beginnt mit „RZ1.“ und muss vollständig kopiert sein."; $("codeConfirm").hidden = true; return; }
      pendingImport = nx; $("codeInMsg").textContent = "";
      $("codeConfirmText").textContent = `Spielstand mit ${nx.correct} gelösten Aufgaben und ${Object.keys(nx.pups).length} Welpen laden? Der jetzige Stand (${state.correct} Aufgaben) wird ersetzt.`;
      $("codeConfirm").hidden = false;
    } else if (id === "codeNo") { pendingImport = null; $("codeConfirm").hidden = true; }
    else if (id === "codeYes" && pendingImport) { const nx = pendingImport; pendingImport = null; state = nx; save(); dirtyTask = true; syncTop(); renderProgress(); renderParents(); $("backupMsg").textContent = "Spielstand geladen."; }
    else if (id === "resetBtn") $("resetRow").innerHTML = `<span class="note">Wirklich alles zurücksetzen? Die Einstellungen bleiben.</span> <button class="link-btn danger" id="resetYes" type="button">Ja, zurücksetzen</button> <button class="link-btn" id="resetNo" type="button">Abbrechen</button>`;
    else if (id === "resetYes") { const keep = { cfg: state.cfg, areas: state.areas, sound: state.sound }; state = { ...freshState(), ...keep }; save(); dirtyTask = true; syncTop(); renderProgress(); renderParents(); }
    else if (id === "resetNo") renderParents();
  });
  let pendingImport = null;

  // Für automatische Tests
  window.__rzr = { SKILLS, T, state: () => state, setState: (s) => { state = s; }, nextTask, recordResult, countReward, sanitize, mem, cur: () => ({ task, ui }), clock, statusOf, templeGradeCalc, newTask };

  // ---------- Start ----------
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* kein Problem */ }
  load();
  syncTop();
  renderProgress();
  newTask();
  initCloud();

})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
